name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-local-alpha.sh --static

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - uses: postmanlabs/postman-cli-action@v1
        with:
          command: --version
      - run: ./scripts/check-local-alpha.sh
        env:
          REMBRANE_RUN_LOOPBACK_TESTS: "1"

  configured-encryption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - run: >-
          cargo test
          --package rembrane-key-provider-http
          --package rembrane-crypto-configured
          --package rembrane-cli
          --package rembrane-api
          --package rembrane-mcp
      - run: >-
          cargo clippy
          --package rembrane-key-provider-http
          --package rembrane-crypto-configured
          --package rembrane-cli
          --package rembrane-api
          --package rembrane-mcp
          --all-targets -- -D warnings

  graphiti-sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e 'sidecars/rembrane-graphiti[dev]'
      - run: ./scripts/test-graphiti-sidecar.sh
      - run: ./scripts/test-graphiti-http-e2e.sh
      - run: >-
          cargo clippy
          --package rembrane-graph-graphiti
          --package rembrane-graph-graphiti-http
          --all-targets -- -D warnings

  memory-provider-http:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - run: node scripts/test-memory-provider-http-runner.mjs
      - run: >-
          cargo test
          --package rembrane-memory-provider-http
          --package rembrane-memory-provider-configured
      - run: >-
          cargo clippy
          --package rembrane-memory-provider-http
          --package rembrane-memory-provider-configured
          --all-targets -- -D warnings

  kotlin-sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require the runner Kotlin toolchain
        run: |
          command -v kotlinc
          command -v java
          kotlinc -version
      - run: ./scripts/test-kotlin-sdk.sh

  postgres-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test-postgres-rls.sh
        env:
          REMBRANE_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag rembrane:ci .
