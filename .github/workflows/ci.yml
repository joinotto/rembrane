name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, SSPL-1.0

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install static test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep jq sqlite3 ruby openssl curl python3
      - run: ./scripts/check-local-alpha.sh --static

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep jq sqlite3 ruby openssl curl python3
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - uses: postmanlabs/postman-cli-action@v1
        with:
          command: --version
      - run: ./scripts/check-local-alpha.sh
        env:
          REMBRANE_RUN_LOOPBACK_TESTS: "1"

  configured-encryption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - run: >-
          cargo test
          --package rembrane-key-provider-http
          --package rembrane-crypto-configured
          --package rembrane-cli
          --package rembrane-api
          --package rembrane-mcp
      - run: >-
          cargo clippy
          --package rembrane-key-provider-http
          --package rembrane-crypto-configured
          --package rembrane-cli
          --package rembrane-api
          --package rembrane-mcp
          --all-targets -- -D warnings

  windows-keyring:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - run: cargo test --package rembrane-crypto-rustcrypto
      - run: cargo clippy --package rembrane-crypto-rustcrypto --all-targets -- -D warnings

  graphiti-sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e 'sidecars/rembrane-graphiti[dev]'
      - run: ./scripts/test-graphiti-sidecar.sh
      - run: ./scripts/test-graphiti-http-e2e.sh
      - run: >-
          cargo clippy
          --package rembrane-graph-graphiti
          --package rembrane-graph-graphiti-http
          --all-targets -- -D warnings

  memory-provider-http:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install provider runner prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep jq openssl curl
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - run: node scripts/test-memory-provider-http-runner.mjs
      - run: >-
          cargo test
          --package rembrane-memory-provider-http
          --package rembrane-memory-provider-configured
      - run: >-
          cargo clippy
          --package rembrane-memory-provider-http
          --package rembrane-memory-provider-configured
          --all-targets -- -D warnings

  kotlin-sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install SDK contract prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Require the runner Kotlin toolchain
        run: |
          command -v kotlinc
          command -v java
          kotlinc -version
      - run: ./scripts/test-kotlin-sdk.sh

  postgres-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rembrane_test_rls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create private disposable fixture service
        run: |
          umask 077
          printf '%s\n' '[rembrane_fixture]' 'host=127.0.0.1' 'port=5432' \
            'user=postgres' 'password=postgres' 'dbname=rembrane_test_rls' \
            'connect_timeout=10' > "$RUNNER_TEMP/rembrane-fixture.conf"
      - run: ./scripts/test-postgres-rls.sh
        env:
          REMBRANE_POSTGRES_TEST_SERVICE_FILE: ${{ runner.temp }}/rembrane-fixture.conf
          REMBRANE_POSTGRES_TEST_DATABASE: rembrane_test_rls
          REMBRANE_POSTGRES_TEST_CONFIRM: disposable-empty-database
      - name: Remove private fixture profile
        if: always()
        run: rm -f "$RUNNER_TEMP/rembrane-fixture.conf"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag rembrane:ci .
