name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-local-alpha.sh --static

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - uses: postmanlabs/postman-cli-action@v1
        with:
          command: --version
      - run: ./scripts/check-local-alpha.sh
        env:
          REMBRANE_RUN_LOOPBACK_TESTS: "1"

  configured-encryption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - run: >-
          cargo test
          --package rembrane-key-provider-http
          --package rembrane-crypto-configured
          --package rembrane-cli
          --package rembrane-api
          --package rembrane-mcp
      - run: >-
          cargo clippy
          --package rembrane-key-provider-http
          --package rembrane-crypto-configured
          --package rembrane-cli
          --package rembrane-api
          --package rembrane-mcp
          --all-targets -- -D warnings

  graphiti-sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e 'sidecars/rembrane-graphiti[dev]'
      - run: ./scripts/test-graphiti-sidecar.sh
      - run: ./scripts/test-graphiti-http-e2e.sh
      - run: >-
          cargo clippy
          --package rembrane-graph-graphiti
          --package rembrane-graph-graphiti-http
          --all-targets -- -D warnings

  memory-provider-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - run: cargo test --package rembrane-memory-provider-http
      - run: >-
          cargo clippy
          --package rembrane-memory-provider-http
          --all-targets -- -D warnings

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag rembrane:ci .
