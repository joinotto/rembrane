name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-local-alpha.sh --static

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - uses: postmanlabs/postman-cli-action@v1
        with:
          command: --version
      - run: ./scripts/check-local-alpha.sh
        env:
          REMBRANE_RUN_LOOPBACK_TESTS: "1"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag rembrane:ci .
