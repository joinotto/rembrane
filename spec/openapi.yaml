openapi: 3.1.0
info:
  title: Rembrane API
  version: 0.1.0
  description: |
    Provider-independent API for user-owned AI memory. This pre-alpha
    contract currently covers capability discovery, scoped context resolution,
    and authorized travel research capture.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    url: https://github.com/mesh-ai-labs/rembrane
servers:
  - url: https://memory.example.test/v1
security:
  - bearerAuth: []
paths:
  /.well-known/ai-memory:
    get:
      operationId: discoverMemoryProvider
      summary: Discover provider capabilities
      security: []
      responses:
        "200":
          description: Provider discovery document
          content:
            application/json:
              schema:
                $ref: ./discovery.schema.json
  /context/resolve:
    post:
      operationId: resolveContext
      summary: Resolve the minimum authorized context for a purpose
      description: |
        Resolves confirmed memories within both the requested scope and the
        calling client's grant. Successful responses are associated with an
        append-only disclosure receipt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveContextRequest"
      responses:
        "200":
          description: Authorized context pack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveContextResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "409":
          $ref: "#/components/responses/Conflict"
  /travel/booking-research:
    post:
      operationId: captureBookingResearch
      summary: Capture expiring evidence-backed research for a trip
      description: |
        Stores one encrypted research observation under an exact trip entity
        grant and appends its canonical workspace event atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureBookingResearchRequest"
      responses:
        "201":
          description: Research observation captured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResearchResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /travel/trips:
    post:
      operationId: createTrip
      summary: Create an encrypted trip
      description: |
        Creates a trip under the authenticated connection's travel-domain
        capability and derives exact entity authority for subsequent calls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTripRequest"
      responses:
        "201":
          description: Trip created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "409":
          $ref: "#/components/responses/Conflict"
  /travel/context/resolve:
    post:
      operationId: resolveTravelContext
      summary: Resolve audited continuity context for one trip
      description: |
        Returns the authorized trip and classifies its research against the
        supplied canonical UTC clock. The server records an exact-version
        disclosure receipt before returning plaintext. Opaque provider source
        references are intentionally excluded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveTravelContextRequest"
      responses:
        "200":
          description: Audited travel context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelContextResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  responses:
    InvalidRequest:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthenticated:
      description: Authentication is missing or invalid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AccessDenied:
      description: The client grant does not authorize this operation
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: A version or event sequence conflict occurred
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The canonical trip was not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    OpaqueId:
      type: string
      minLength: 1
      maxLength: 255
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
    ResolveContextRequest:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - subjectId
        - purpose
        - query
        - maximumItems
      properties:
        workspaceId:
          $ref: "#/components/schemas/OpaqueId"
        subjectId:
          $ref: "#/components/schemas/OpaqueId"
        domain:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 100
        entityId:
          oneOf:
            - $ref: "#/components/schemas/OpaqueId"
            - type: "null"
        activityId:
          oneOf:
            - $ref: "#/components/schemas/OpaqueId"
            - type: "null"
        purpose:
          type: string
          minLength: 1
          maxLength: 255
        query:
          type: string
          minLength: 1
          maxLength: 8192
        maximumItems:
          type: integer
          minimum: 1
          maximum: 100
        maximumBytes:
          type: integer
          minimum: 1
          maximum: 1048576
          default: 65536
    ResolveContextResponse:
      type: object
      additionalProperties: false
      required:
        - contextPackId
        - disclosureId
        - items
      properties:
        contextPackId:
          $ref: "#/components/schemas/OpaqueId"
        disclosureId:
          $ref: "#/components/schemas/OpaqueId"
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Memory"
    ResolveTravelContextRequest:
      type: object
      additionalProperties: false
      required: [workspaceId, subjectId, tripId, purpose, asOf]
      properties:
        workspaceId:
          $ref: "#/components/schemas/OpaqueId"
        subjectId:
          $ref: "#/components/schemas/OpaqueId"
        tripId:
          $ref: "#/components/schemas/OpaqueId"
        purpose:
          type: string
          minLength: 1
          maxLength: 255
        asOf:
          type: string
          format: date-time
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
        includeSourceReferences:
          type: boolean
          default: false
          description: |
            Requires the connection-level travel-source-references permission.
            Requests without that permission fail closed.
    TravelContextResponse:
      type: object
      additionalProperties: false
      required: [disclosureId, trip, freshResearch, expiredResearch]
      properties:
        disclosureId:
          $ref: "#/components/schemas/OpaqueId"
        trip:
          $ref: "#/components/schemas/TravelTrip"
        freshResearch:
          type: array
          items:
            $ref: "#/components/schemas/TravelResearch"
        expiredResearch:
          type: array
          items:
            $ref: "#/components/schemas/TravelResearch"
    TravelTrip:
      type: object
      additionalProperties: false
      required:
        - tripId
        - title
        - origin
        - destinations
        - departNotBefore
        - returnNotAfter
        - version
      properties:
        tripId:
          $ref: "#/components/schemas/OpaqueId"
        title:
          type: string
        origin:
          type: string
        destinations:
          type: array
          items:
            type: string
        departNotBefore:
          type: string
          format: date
        returnNotAfter:
          type: string
          format: date
        version:
          type: integer
          minimum: 1
    TravelResearch:
      type: object
      additionalProperties: false
      required:
        - researchId
        - kind
        - provider
        - summary
        - evidenceId
        - observedAt
        - expiresAt
        - version
      properties:
        researchId:
          $ref: "#/components/schemas/OpaqueId"
        kind:
          enum: [flight, lodging, ground-transport, activity, other]
        provider:
          type: string
        summary:
          type: string
        evidenceId:
          $ref: "#/components/schemas/OpaqueId"
        observedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
        sourceReference:
          type: string
          description: |
            Present only after explicit request under a connection authorized
            for the travel-source-references sensitive read permission.
    CaptureBookingResearchRequest:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - subjectId
        - tripId
        - kind
        - provider
        - summary
        - sourceReference
        - evidenceSource
        - observedAt
        - expiresAt
        - expectedPreviousSequence
      properties:
        workspaceId:
          $ref: "#/components/schemas/OpaqueId"
        subjectId:
          $ref: "#/components/schemas/OpaqueId"
        tripId:
          $ref: "#/components/schemas/OpaqueId"
        kind:
          enum: [flight, lodging, ground-transport, activity, other]
        provider:
          type: string
          minLength: 1
          maxLength: 16384
        summary:
          type: string
          minLength: 1
          maxLength: 16384
        sourceReference:
          type: string
          minLength: 1
          maxLength: 16384
          description: Opaque provider result reference; clients should avoid credentials.
        evidenceSource:
          enum:
            - user-statement
            - agent-observation
            - tool-result
            - imported-record
            - workspace-decision
        observedAt:
          type: string
          format: date-time
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
        expiresAt:
          type: string
          format: date-time
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
        expectedPreviousSequence:
          type: integer
          minimum: 0
    CreateTripRequest:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - subjectId
        - title
        - origin
        - destinations
        - departNotBefore
        - returnNotAfter
        - expectedPreviousSequence
      properties:
        workspaceId:
          $ref: "#/components/schemas/OpaqueId"
        subjectId:
          $ref: "#/components/schemas/OpaqueId"
        title:
          type: string
          minLength: 1
          maxLength: 4096
        origin:
          type: string
          minLength: 1
          maxLength: 4096
        destinations:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 4096
        departNotBefore:
          type: string
          format: date
        returnNotAfter:
          type: string
          format: date
        expectedPreviousSequence:
          type: integer
          minimum: 0
    TripResponse:
      type: object
      additionalProperties: false
      required:
        - tripId
        - workspaceId
        - ownerSubjectId
        - version
      properties:
        tripId:
          $ref: "#/components/schemas/OpaqueId"
        workspaceId:
          $ref: "#/components/schemas/OpaqueId"
        ownerSubjectId:
          $ref: "#/components/schemas/OpaqueId"
        version:
          type: integer
          minimum: 1
    BookingResearchResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceId
        - tripId
        - observedBy
        - version
        - expiresAt
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        workspaceId:
          $ref: "#/components/schemas/OpaqueId"
        tripId:
          $ref: "#/components/schemas/OpaqueId"
        observedBy:
          $ref: "#/components/schemas/OpaqueId"
        version:
          type: integer
          minimum: 1
        expiresAt:
          type: string
          format: date-time
    Memory:
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceId
        - subjectId
        - scope
        - kind
        - status
        - content
        - version
        - evidence
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        workspaceId:
          $ref: "#/components/schemas/OpaqueId"
        subjectId:
          $ref: "#/components/schemas/OpaqueId"
        scope:
          $ref: "#/components/schemas/MemoryScope"
        kind:
          enum:
            - preference
            - semantic
            - episodic
            - procedural
            - observation
            - working
        status:
          enum:
            - proposed
            - confirmed
            - superseded
            - deleted
        content:
          type: string
        version:
          type: integer
          minimum: 1
        evidence:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/EvidenceReference"
    MemoryScope:
      oneOf:
        - $ref: "#/components/schemas/GlobalScope"
        - $ref: "#/components/schemas/DomainScope"
        - $ref: "#/components/schemas/EntityScope"
        - $ref: "#/components/schemas/ActivityScope"
      discriminator:
        propertyName: type
    GlobalScope:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          const: global
    DomainScope:
      type: object
      additionalProperties: false
      required:
        - type
        - name
      properties:
        type:
          const: domain
        name:
          type: string
          minLength: 1
          maxLength: 100
    EntityScope:
      type: object
      additionalProperties: false
      required:
        - type
        - id
      properties:
        type:
          const: entity
        id:
          $ref: "#/components/schemas/OpaqueId"
    ActivityScope:
      type: object
      additionalProperties: false
      required:
        - type
        - id
      properties:
        type:
          const: activity
        id:
          $ref: "#/components/schemas/OpaqueId"
    EvidenceReference:
      type: object
      additionalProperties: false
      required:
        - id
        - source
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        source:
          enum:
            - user-statement
            - agent-observation
            - tool-result
            - imported-record
            - workspace-decision
    Problem:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        requestId:
          $ref: "#/components/schemas/OpaqueId"
