      required:
        - workspaceId
        - subjectId
        - title
        - origin
        - destinations
        - departNotBefore
        - returnNotAfter
        - expectedPreviousSequence
      properties:
        workspaceId:
          $ref: "#/components/schemas/OpaqueId"
        subjectId:
          $ref: "#/components/schemas/OpaqueId"
        title:
          type: string
          minLength: 1
          maxLength: 4096
        origin:
          type: string
          minLength: 1
          maxLength: 4096
        destinations:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 4096
        departNotBefore:
          type: string
          format: date
        returnNotAfter:
          type: string
          format: date
        expectedPreviousSequence:
          type: integer
          minimum: 0
    TripResponse:
