          $ref: "#/components/schemas/OpaqueId"
        workspaceId:
          $ref: "#/components/schemas/OpaqueId"
        ownerSubjectId:
          $ref: "#/components/schemas/OpaqueId"
        version:
          type: integer
          minimum: 1
    BookingResearchResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceId
        - tripId
        - observedBy
        - version
        - expiresAt
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        workspaceId:
          $ref: "#/components/schemas/OpaqueId"
        tripId:
          $ref: "#/components/schemas/OpaqueId"
        observedBy:
