openapi: 3.1.0
info:
  title: Rembrane API
  version: 0.1.0
  description: |
    Provider-independent API for user-owned AI memory. This pre-alpha
    contract currently covers capability discovery, scoped context resolution,
    and authorized travel research capture.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    url: https://github.com/mesh-ai-labs/rembrane
servers:
  - url: https://memory.example.test/v1
security:
  - bearerAuth: []
paths:
  /.well-known/ai-memory:
    get:
      operationId: discoverMemoryProvider
      summary: Discover provider capabilities
      security: []
      responses:
        "200":
          description: Provider discovery document
          content:
            application/json:
              schema:
                $ref: ./discovery.schema.json
  /context/resolve:
    post:
      operationId: resolveContext
      summary: Resolve the minimum authorized context for a purpose
      description: |
        Resolves confirmed memories within both the requested scope and the
        calling client's grant. Successful responses are associated with an
        append-only disclosure receipt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveContextRequest"
      responses:
        "200":
          description: Authorized context pack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveContextResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "409":
          $ref: "#/components/responses/Conflict"
  /workspaces/key-rotation:
    post:
      operationId: rotateWorkspaceKey
      summary: Complete a required shared-workspace key rotation
      description: |
        Authorizes the configured owner or administrator, derives the exact
        active recipient set from canonical membership, invokes the configured
        customer key provider, validates its receipt, and records completion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateWorkspaceKeyRequest"
      responses:
        "200":
          description: Key rotation completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateWorkspaceKeyResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /administrative-audit:
    get:
      operationId: listAdministrativeAudit
      summary: List bounded content-free administrative audit evidence
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/OpaqueId"
        - name: afterEpochSeconds
          in: query
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Tenant-scoped administrative audit page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdministrativeAuditResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
  /retention/policy:
    post:
      operationId: setRetentionPolicy
      summary: Create or optimistically replace a workspace retention policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRetentionPolicyRequest"
      responses:
        "200":
          description: Retention policy stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionPolicyResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "409":
          $ref: "#/components/responses/Conflict"
  /retention/legal-holds:
    post:
      operationId: placeLegalHold
      summary: Place a workspace legal hold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalHoldRequest"
      responses:
        "201":
          description: Legal hold placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalHoldResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "409":
          $ref: "#/components/responses/Conflict"
  /retention/legal-holds/release:
    post:
      operationId: releaseLegalHold
      summary: Release one active workspace legal hold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalHoldRequest"
      responses:
        "200":
          description: Legal hold released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalHoldResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /retention/purge:
    post:
      operationId: executeRetentionPurge
      summary: Execute one bounded hold-aware retention purge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteRetentionPurgeRequest"
      responses:
        "200":
          description: Bounded purge result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionPurgeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
  /travel/booking-research:
    post:
      operationId: captureBookingResearch
      summary: Capture expiring evidence-backed research for a trip
      description: |
        Stores one encrypted research observation under an exact trip entity
        grant and appends its canonical workspace event atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureBookingResearchRequest"
      responses:
        "201":
          description: Research observation captured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResearchResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /travel/trips:
    post:
      operationId: createTrip
      summary: Create an encrypted trip
      description: |
        Creates a trip under the authenticated connection's travel-domain
        capability and derives exact entity authority for subsequent calls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTripRequest"
      responses:
        "201":
          description: Trip created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "409":
          $ref: "#/components/responses/Conflict"
  /travel/context/resolve:
    post:
      operationId: resolveTravelContext
      summary: Resolve audited continuity context for one trip
      description: |
        Returns the authorized trip and classifies its research against the
        supplied canonical UTC clock. The server records an exact-version
        disclosure receipt before returning plaintext. Opaque provider source
        references are intentionally excluded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveTravelContextRequest"
      responses:
        "200":
          description: Audited travel context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelContextResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /travel/trip-participants:
    post:
      operationId: addTripParticipant
      summary: Add one participant without replacing unrelated trip state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTripParticipantRequest"
      responses:
        "201":
          description: Participant added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripParticipantResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /travel/trip-constraints:
    post:
      operationId: addTripConstraint
      summary: Add an evidence-backed constraint without replacing the trip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTripConstraintRequest"
      responses:
        "201":
          description: Constraint added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripRevisionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /travel/trip-decisions:
    post:
      operationId: recordTripDecision
      summary: Record a decision attributed to the authenticated principal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordTripDecisionRequest"
      responses:
        "201":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripRevisionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  responses:
    InvalidRequest:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthenticated:
      description: Authentication is missing or invalid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AccessDenied:
      description: The client grant does not authorize this operation
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: A version or event sequence conflict occurred
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The canonical trip was not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    RotateWorkspaceKeyRequest:
      type: object
      additionalProperties: false
      required: [workspaceId]
      properties:
        workspaceId:
          $ref: "#/components/schemas/OpaqueId"
    RotateWorkspaceKeyResponse:
      type: object
      additionalProperties: false
      required: [workspaceId, generation, keyId, status]
      properties:
        workspaceId:
          $ref: "#/components/schemas/OpaqueId"
        generation:
          type: integer
          minimum: 1
        keyId:
          type: string
          minLength: 1
        status:
          const: completed
    AdministrativeAuditResponse:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/AdministrativeAuditEvent"
    AdministrativeAuditEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceId
        - actorId
        - action
        - targetKind
        - targetId
        - requestId
        - occurredAtEpochSeconds
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        workspaceId:
          $ref: "#/components/schemas/OpaqueId"
        actorId:
          $ref: "#/components/schemas/OpaqueId"
        action:
          enum:
            - member-removed
            - key-rotation-required
            - key-rotation-completed
            - scope-grant-changed
            - retention-policy-changed
            - legal-hold-placed
            - legal-hold-released
        targetKind:
          enum: [principal, key-rotation, scope-grant, retention-policy, legal-hold]
        targetId:
          $ref: "#/components/schemas/OpaqueId"
        requestId:
          $ref: "#/components/schemas/OpaqueId"
        occurredAtEpochSeconds:
          type: integer
          minimum: 1
    SetRetentionPolicyRequest:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - requestId
      properties:
        workspaceId:
          $ref: "#/components/schemas/OpaqueId"
        expectedVersion:
          type:
            - integer
            - "null"
          minimum: 1
        userMemoryDays:
          $ref: "#/components/schemas/RetentionDays"
        activityCheckpointDays:
          $ref: "#/components/schemas/RetentionDays"
        travelResearchDays:
          $ref: "#/components/schemas/RetentionDays"
        disclosureReceiptDays:
          $ref: "#/components/schemas/RetentionDays"
        canonicalEventDays:
          $ref: "#/components/schemas/RetentionDays"
        administrativeAuditDays:
          $ref: "#/components/schemas/RetentionDays"
        requestId:
          $ref: "#/components/schemas/OpaqueId"
    RetentionDays:
      description: A null value retains the resource forever.
      type:
        - integer
        - "null"
      minimum: 1
      maximum: 36500
    RetentionPolicyResponse:
      type: object
      additionalProperties: false
      required: [workspaceId, version]
      properties:
        workspaceId:
          $ref: "#/components/schemas/OpaqueId"
        version:
          type: integer
          minimum: 1
    LegalHoldRequest:
      type: object
      additionalProperties: false
      required: [workspaceId, holdId, requestId]
      properties:
        workspaceId:
          $ref: "#/components/schemas/OpaqueId"
        holdId:
          $ref: "#/components/schemas/OpaqueId"
        requestId:
          $ref: "#/components/schemas/OpaqueId"
    LegalHoldResponse:
      type: object
      additionalProperties: false
      required: [workspaceId, holdId, version, status]
      properties:
        workspaceId:
          $ref: "#/components/schemas/OpaqueId"
        holdId:
          $ref: "#/components/schemas/OpaqueId"
        version:
          type: integer
          minimum: 1
        status:
          enum: [active, released]
    ExecuteRetentionPurgeRequest:
      type: object
      additionalProperties: false
      required: [workspaceId, maximumItems]
      properties:
        workspaceId:
          $ref: "#/components/schemas/OpaqueId"
        maximumItems:
          type: integer
          minimum: 1
          maximum: 1000
    RetentionPurgeResponse:
      type: object
      additionalProperties: false
      required:
        - memories
        - checkpoints
        - travelResearch
        - disclosures
        - canonicalEvents
        - total
      properties:
        memories:
          type: integer
          minimum: 0
        checkpoints:
          type: integer
          minimum: 0
        travelResearch:
          type: integer
          minimum: 0
        disclosures:
          type: integer
          minimum: 0
        canonicalEvents:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
          maximum: 1000
    OpaqueId:
      type: string
      minLength: 1
      maxLength: 255
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
    ResolveContextRequest:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - subjectId
        - purpose
        - query
        - maximumItems
      properties:
        workspaceId:
          $ref: "#/components/schemas/OpaqueId"
        subjectId:
          $ref: "#/components/schemas/OpaqueId"
        domain:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 100
        entityId:
          oneOf:
            - $ref: "#/components/schemas/OpaqueId"
            - type: "null"
        activityId:
          oneOf:
            - $ref: "#/components/schemas/OpaqueId"
            - type: "null"
        purpose:
          type: string
          minLength: 1
          maxLength: 255
        query:
          type: string
          minLength: 1
          maxLength: 8192
        maximumItems:
          type: integer
          minimum: 1
          maximum: 100
        maximumBytes:
          type: integer
          minimum: 1
          maximum: 1048576
          default: 65536
    ResolveContextResponse:
      type: object
      additionalProperties: false
      required:
        - contextPackId
        - disclosureId
        - items
      properties:
        contextPackId:
          $ref: "#/components/schemas/OpaqueId"
        disclosureId:
          $ref: "#/components/schemas/OpaqueId"
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Memory"
    ResolveTravelContextRequest:
      type: object
      additionalProperties: false
      required: [workspaceId, subjectId, tripId, purpose, asOf]
      properties:
        workspaceId:
          $ref: "#/components/schemas/OpaqueId"
        subjectId:
          $ref: "#/components/schemas/OpaqueId"
        tripId:
          $ref: "#/components/schemas/OpaqueId"
        purpose:
          type: string
          minLength: 1
          maxLength: 255
        asOf:
          type: string
          format: date-time
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
        includeSourceReferences:
          type: boolean
          default: false
          description: |
            Requires the connection-level travel-source-references permission.
            Requests without that permission fail closed.
        includeSensitiveProfile:
          type: boolean
          default: false
          description: |
            Requires the connection-level travel-sensitive-profile permission.
            Controls participant labels, constraints, and decisions.
    AddTripParticipantRequest:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - subjectId
        - tripId
        - label
        - expectedTripVersion
        - expectedPreviousSequence
      properties:
        workspaceId:
          $ref: "#/components/schemas/OpaqueId"
        subjectId:
          $ref: "#/components/schemas/OpaqueId"
        tripId:
          $ref: "#/components/schemas/OpaqueId"
        label:
          type: string
          minLength: 1
          maxLength: 4096
        expectedTripVersion:
          type: integer
          minimum: 1
        expectedPreviousSequence:
          type: integer
          minimum: 0
    TripParticipantResponse:
      type: object
      additionalProperties: false
      required: [tripId, participantId, label, tripVersion]
      properties:
        tripId:
          $ref: "#/components/schemas/OpaqueId"
        participantId:
          $ref: "#/components/schemas/OpaqueId"
        label:
          type: string
        tripVersion:
          type: integer
          minimum: 2
    AddTripConstraintRequest:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - subjectId
        - tripId
        - kind
        - statement
        - evidenceSource
        - expectedTripVersion
        - expectedPreviousSequence
      properties:
        workspaceId:
          $ref: "#/components/schemas/OpaqueId"
        subjectId:
          $ref: "#/components/schemas/OpaqueId"
        tripId:
          $ref: "#/components/schemas/OpaqueId"
        participantId:
          oneOf:
            - $ref: "#/components/schemas/OpaqueId"
            - type: "null"
        kind:
          enum:
            - accessibility
            - accommodation
            - budget
            - dietary
            - documentation
            - schedule
            - transport
            - other
        statement:
          type: string
          minLength: 1
          maxLength: 4096
        evidenceSource:
          enum:
            - user-statement
            - agent-observation
            - tool-result
            - imported-record
            - workspace-decision
        expectedTripVersion:
          type: integer
          minimum: 1
        expectedPreviousSequence:
          type: integer
          minimum: 0
    RecordTripDecisionRequest:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - subjectId
        - tripId
        - status
        - summary
        - evidenceSource
        - expectedTripVersion
        - expectedPreviousSequence
      properties:
        workspaceId:
          $ref: "#/components/schemas/OpaqueId"
        subjectId:
          $ref: "#/components/schemas/OpaqueId"
        tripId:
          $ref: "#/components/schemas/OpaqueId"
        status:
          enum: [proposed, selected, rejected]
        summary:
          type: string
          minLength: 1
          maxLength: 4096
        rationale:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 4096
        evidenceSource:
          enum:
            - user-statement
            - agent-observation
            - tool-result
            - imported-record
            - workspace-decision
        expectedTripVersion:
          type: integer
          minimum: 1
        expectedPreviousSequence:
          type: integer
          minimum: 0
    TripRevisionResponse:
      type: object
      additionalProperties: false
      required: [tripId, recordId, tripVersion]
      properties:
        tripId:
          $ref: "#/components/schemas/OpaqueId"
        recordId:
          $ref: "#/components/schemas/OpaqueId"
        tripVersion:
          type: integer
          minimum: 2
    TravelContextResponse:
      type: object
      additionalProperties: false
      required: [disclosureId, trip, freshResearch, expiredResearch]
      properties:
        disclosureId:
          $ref: "#/components/schemas/OpaqueId"
        trip:
          $ref: "#/components/schemas/TravelTrip"
        freshResearch:
          type: array
          items:
            $ref: "#/components/schemas/TravelResearch"
        expiredResearch:
          type: array
          items:
            $ref: "#/components/schemas/TravelResearch"
    TravelTrip:
      type: object
      additionalProperties: false
      required:
        - tripId
        - title
        - origin
        - destinations
        - departNotBefore
        - returnNotAfter
        - version
      properties:
        tripId:
          $ref: "#/components/schemas/OpaqueId"
        title:
          type: string
        origin:
          type: string
        destinations:
          type: array
          items:
            type: string
        departNotBefore:
          type: string
          format: date
        returnNotAfter:
          type: string
          format: date
        version:
          type: integer
          minimum: 1
        sensitiveProfile:
          $ref: "#/components/schemas/TravelSensitiveProfile"
    TravelSensitiveProfile:
      type: object
      additionalProperties: false
      required: [participants, constraints, decisions]
      properties:
        participants:
          type: array
          items:
            $ref: "#/components/schemas/TravelParticipant"
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/TravelConstraint"
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/TravelDecision"
    TravelParticipant:
      type: object
      additionalProperties: false
      required: [participantId, label]
      properties:
        participantId:
          $ref: "#/components/schemas/OpaqueId"
        label:
          type: string
    TravelConstraint:
      type: object
      additionalProperties: false
      required: [constraintId, kind, statement, evidenceId]
      properties:
        constraintId:
          $ref: "#/components/schemas/OpaqueId"
        participantId:
          oneOf:
            - $ref: "#/components/schemas/OpaqueId"
            - type: "null"
        kind:
          enum:
            - accessibility
            - accommodation
            - budget
            - dietary
            - documentation
            - schedule
            - transport
            - other
        statement:
          type: string
        evidenceId:
          $ref: "#/components/schemas/OpaqueId"
    TravelDecision:
      type: object
      additionalProperties: false
      required: [decisionId, status, summary, decidedBy, evidenceId]
      properties:
        decisionId:
          $ref: "#/components/schemas/OpaqueId"
        status:
          enum: [proposed, selected, rejected]
        summary:
          type: string
        rationale:
          type:
            - string
            - "null"
        decidedBy:
          $ref: "#/components/schemas/OpaqueId"
        evidenceId:
          $ref: "#/components/schemas/OpaqueId"
    TravelResearch:
      type: object
      additionalProperties: false
      required:
        - researchId
        - kind
        - provider
        - summary
        - evidenceId
        - observedAt
        - expiresAt
        - version
      properties:
        researchId:
          $ref: "#/components/schemas/OpaqueId"
        kind:
          enum: [flight, lodging, ground-transport, activity, other]
        provider:
          type: string
        summary:
          type: string
        evidenceId:
          $ref: "#/components/schemas/OpaqueId"
        observedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
        sourceReference:
          type: string
          description: |
            Present only after explicit request under a connection authorized
            for the travel-source-references sensitive read permission.
    CaptureBookingResearchRequest:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - subjectId
        - tripId
        - kind
        - provider
        - summary
        - sourceReference
        - evidenceSource
        - observedAt
        - expiresAt
        - expectedPreviousSequence
      properties:
        workspaceId:
          $ref: "#/components/schemas/OpaqueId"
        subjectId:
          $ref: "#/components/schemas/OpaqueId"
        tripId:
          $ref: "#/components/schemas/OpaqueId"
        kind:
          enum: [flight, lodging, ground-transport, activity, other]
        provider:
          type: string
          minLength: 1
          maxLength: 16384
        summary:
          type: string
          minLength: 1
          maxLength: 16384
        sourceReference:
          type: string
          minLength: 1
          maxLength: 16384
          description: Opaque provider result reference; clients should avoid credentials.
        evidenceSource:
          enum:
            - user-statement
            - agent-observation
            - tool-result
            - imported-record
            - workspace-decision
        observedAt:
          type: string
          format: date-time
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
        expiresAt:
          type: string
          format: date-time
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
        expectedPreviousSequence:
          type: integer
          minimum: 0
    CreateTripRequest:
