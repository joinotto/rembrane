    Memory:
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceId
        - subjectId
        - scope
        - kind
        - status
        - content
        - version
        - evidence
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        workspaceId:
          $ref: "#/components/schemas/OpaqueId"
        subjectId:
          $ref: "#/components/schemas/OpaqueId"
        scope:
          $ref: "#/components/schemas/MemoryScope"
        kind:
          enum:
            - preference
            - semantic
            - episodic
            - procedural
            - observation
            - working
        status:
          enum:
            - proposed
            - confirmed
            - superseded
            - deleted
        content:
          type: string
        version:
          type: integer
          minimum: 1
        evidence:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/EvidenceReference"
    MemoryScope:
      oneOf:
        - $ref: "#/components/schemas/GlobalScope"
        - $ref: "#/components/schemas/DomainScope"
        - $ref: "#/components/schemas/EntityScope"
        - $ref: "#/components/schemas/ActivityScope"
      discriminator:
        propertyName: type
    GlobalScope:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          const: global
    DomainScope:
      type: object
      additionalProperties: false
      required:
        - type
        - name
      properties:
        type:
          const: domain
        name:
          type: string
          minLength: 1
          maxLength: 100
    EntityScope:
      type: object
      additionalProperties: false
      required:
        - type
        - id
      properties:
        type:
          const: entity
        id:
          $ref: "#/components/schemas/OpaqueId"
    ActivityScope:
      type: object
      additionalProperties: false
      required:
        - type
        - id
      properties:
        type:
          const: activity
        id:
          $ref: "#/components/schemas/OpaqueId"
    EvidenceReference:
      type: object
      additionalProperties: false
      required:
        - id
        - source
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        source:
          enum:
            - user-statement
            - agent-observation
            - tool-result
            - imported-record
            - workspace-decision
    Problem:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        requestId:
          $ref: "#/components/schemas/OpaqueId"
