openapi: 3.1.0
info:
  title: Rembrane Explicit Mobile Share Protocol
  version: 0.1.0
  description: >-
    Narrow protocol for user-mediated shares from companion apps and platform
    share extensions. It does not authorize memory reads or background message
    collection. Clients authenticate the exact request-body bytes with
    HMAC-SHA256 and a device-held deployment secret.
servers:
  - url: http://127.0.0.1:8791
paths:
  /health:
    get:
      operationId: mobileShareHealth
      security: []
      responses:
        "204":
          description: Gateway is ready.
  /v1/shares:
    post:
      operationId: submitExplicitMobileShare
      security:
        - bodySignature: []
      parameters:
        - name: X-Rembrane-Signature-256
          in: header
          required: true
          description: >-
            Lowercase `sha256=` followed by the 64-character hexadecimal
            HMAC-SHA256 of the exact HTTP request-body bytes.
          schema:
            type: string
            pattern: "^sha256=[0-9a-f]{64}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExplicitMobileShare"
      responses:
        "200":
          description: >-
            The share was durably encrypted and admitted, or an authenticated
            duplicate was handled idempotently.
        "202":
          description: >-
            The signature was valid but no active device binding was exposed
            to the caller.
        "400":
          description: The strict envelope is invalid, future-dated, or stale.
        "401":
          description: The body signature is missing or invalid.
        "413":
          description: The request exceeds 65536 bytes.
        "503":
          description: Durable encrypted admission is temporarily unavailable.
components:
  securitySchemes:
    bodySignature:
      type: apiKey
      in: header
      name: X-Rembrane-Signature-256
      description: >-
        Request authentication over exact body bytes. The signing secret is
        provisioned out of band and must not be stored in canonical memory.
  schemas:
    ExplicitMobileShare:
      type: object
      additionalProperties: false
      required:
        - account_id
        - device_id
        - event_id
        - text
        - shared_at_epoch_seconds
      properties:
        account_id:
          type: string
          minLength: 1
          maxLength: 256
          pattern: "^[^[:space:][:cntrl:]]+$"
          description: Opaque identifier; persisted only as a keyed pseudonym.
        device_id:
          type: string
          minLength: 1
          maxLength: 256
          pattern: "^[^[:space:][:cntrl:]]+$"
          description: Opaque identifier; persisted only as a keyed pseudonym.
        event_id:
          type: string
          minLength: 1
          maxLength: 256
          pattern: "^[^[:space:][:cntrl:]]+$"
          description: Stable idempotency identifier generated by the client.
        text:
          type: string
          minLength: 1
          maxLength: 16384
          description: >-
            Text explicitly selected by the user. Implementations enforce a
            16384-byte UTF-8 limit in addition to this schema bound.
        shared_at_epoch_seconds:
          type: integer
          format: int64
          minimum: 1
          description: Client-observed Unix time checked against gateway policy.
