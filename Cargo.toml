[workspace]
members = [
    "adapters/rembrane-channel-mobile-share",
    "adapters/rembrane-channel-whatsapp",
    "adapters/rembrane-channel-processor-http",
    "adapters/rembrane-crypto-rustcrypto",
    "adapters/rembrane-crypto-configured",
    "adapters/rembrane-graph-configured",
    "adapters/rembrane-graph-graphiti",
    "adapters/rembrane-graph-graphiti-http",
    "adapters/rembrane-graph-native",
    "adapters/rembrane-key-provider-http",
    "adapters/rembrane-kms-keyring-sqlite",
    "adapters/rembrane-memory-provider-configured",
    "adapters/rembrane-memory-provider-http",
    "adapters/rembrane-oauth-introspection",
    "adapters/rembrane-oauth-introspection-http",
    "adapters/rembrane-remote-mcp-http",
    "adapters/rembrane-secret-local",
    "adapters/rembrane-store-memory",
    "adapters/rembrane-store-postgres",
    "adapters/rembrane-store-sqlite",
    "adapters/rembrane-semantic-native",
    "adapters/rembrane-semantic-mem0",
    "adapters/rembrane-semantic-supermemory",
    "apps/rembrane-api",
    "apps/rembrane-cli",
    "apps/rembrane-channel-worker",
    "apps/rembrane-mobile-share-gateway",
    "apps/rembrane-graph-worker",
    "apps/rembrane-mcp",
    "apps/rembrane-whatsapp-gateway",
    "crates/rembrane-application",
    "crates/rembrane-codec",
    "crates/rembrane-contracts",
    "crates/rembrane-config",
    "crates/rembrane-crypto",
    "crates/rembrane-domain",
    "crates/rembrane-provider-sdk",
    "crates/rembrane-provider-registry",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/joinotto/rembrane"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
too_many_arguments = "allow"
