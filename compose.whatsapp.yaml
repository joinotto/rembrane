services:
  rembrane-whatsapp-gateway:
    build:
      context: .
    restart: unless-stopped
    command:
      - rembrane-whatsapp-gateway
    environment:
      REMBRANE_DATABASE: /var/lib/rembrane/rembrane.db
      REMBRANE_WHATSAPP_APP_SECRET: ${REMBRANE_WHATSAPP_APP_SECRET:?required}
      REMBRANE_WHATSAPP_BINDING_LOOKUP_SECRET: ${REMBRANE_WHATSAPP_BINDING_LOOKUP_SECRET:?required}
      REMBRANE_WHATSAPP_WEBHOOK_VERIFICATION_TOKEN: ${REMBRANE_WHATSAPP_WEBHOOK_VERIFICATION_TOKEN:?required}
      REMBRANE_WHATSAPP_MAXIMUM_EVENT_AGE_SECONDS: ${REMBRANE_WHATSAPP_MAXIMUM_EVENT_AGE_SECONDS:-300}
      REMBRANE_WHATSAPP_REPLAY_WINDOW_SECONDS: ${REMBRANE_WHATSAPP_REPLAY_WINDOW_SECONDS:-604800}
      REMBRANE_WHATSAPP_MAXIMUM_REPLAY_EVENTS: ${REMBRANE_WHATSAPP_MAXIMUM_REPLAY_EVENTS:-1000000}
      REMBRANE_WHATSAPP_LISTEN: 0.0.0.0:8790
      REMBRANE_WHATSAPP_ALLOW_NON_LOOPBACK: "1"
      REMBRANE_KEY_PROVIDER: ${REMBRANE_KEY_PROVIDER:-environment}
      REMBRANE_WORKSPACE_KEY_ID: ${REMBRANE_WORKSPACE_KEY_ID:-}
      REMBRANE_WORKSPACE_KEY_HEX: ${REMBRANE_WORKSPACE_KEY_HEX:-}
      REMBRANE_KEYCHAIN_SERVICE: ${REMBRANE_KEYCHAIN_SERVICE:-}
      REMBRANE_KEYCHAIN_ACCOUNT: ${REMBRANE_KEYCHAIN_ACCOUNT:-}
      REMBRANE_KEYCHAIN_HISTORICAL_KEYS: ${REMBRANE_KEYCHAIN_HISTORICAL_KEYS:-}
      REMBRANE_KEY_PROVIDER_BASE_URL: ${REMBRANE_KEY_PROVIDER_BASE_URL:-}
      REMBRANE_KEY_PROVIDER_TOKEN: ${REMBRANE_KEY_PROVIDER_TOKEN:-}
      REMBRANE_KEY_PROVIDER_ALGORITHM: ${REMBRANE_KEY_PROVIDER_ALGORITHM:-xchacha20poly1305-ietf}
      REMBRANE_KEY_PROVIDER_REQUIRE_HISTORICAL_KEYS: ${REMBRANE_KEY_PROVIDER_REQUIRE_HISTORICAL_KEYS:-true}
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - rembrane-data:/var/lib/rembrane
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  rembrane-channel-worker:
    build:
      context: .
    restart: unless-stopped
    command:
      - rembrane-channel-worker
    environment:
      REMBRANE_DATABASE: /var/lib/rembrane/rembrane.db
      REMBRANE_WORKSPACE_ID: ${REMBRANE_WORKSPACE_ID:?required}
      REMBRANE_CHANNEL_PROCESSOR_URL: ${REMBRANE_CHANNEL_PROCESSOR_URL:?required}
      REMBRANE_CHANNEL_PROCESSOR_TOKEN: ${REMBRANE_CHANNEL_PROCESSOR_TOKEN:?required}
      REMBRANE_CHANNEL_WORKER_BATCH_SIZE: ${REMBRANE_CHANNEL_WORKER_BATCH_SIZE:-10}
      REMBRANE_CHANNEL_WORKER_POLL_MILLISECONDS: ${REMBRANE_CHANNEL_WORKER_POLL_MILLISECONDS:-1000}
      REMBRANE_KEY_PROVIDER: ${REMBRANE_KEY_PROVIDER:-environment}
      REMBRANE_WORKSPACE_KEY_ID: ${REMBRANE_WORKSPACE_KEY_ID:-}
      REMBRANE_WORKSPACE_KEY_HEX: ${REMBRANE_WORKSPACE_KEY_HEX:-}
      REMBRANE_KEYCHAIN_SERVICE: ${REMBRANE_KEYCHAIN_SERVICE:-}
      REMBRANE_KEYCHAIN_ACCOUNT: ${REMBRANE_KEYCHAIN_ACCOUNT:-}
      REMBRANE_KEYCHAIN_HISTORICAL_KEYS: ${REMBRANE_KEYCHAIN_HISTORICAL_KEYS:-}
      REMBRANE_KEY_PROVIDER_BASE_URL: ${REMBRANE_KEY_PROVIDER_BASE_URL:-}
      REMBRANE_KEY_PROVIDER_TOKEN: ${REMBRANE_KEY_PROVIDER_TOKEN:-}
      REMBRANE_KEY_PROVIDER_ALGORITHM: ${REMBRANE_KEY_PROVIDER_ALGORITHM:-xchacha20poly1305-ietf}
      REMBRANE_KEY_PROVIDER_REQUIRE_HISTORICAL_KEYS: ${REMBRANE_KEY_PROVIDER_REQUIRE_HISTORICAL_KEYS:-true}
    volumes:
      - rembrane-data:/var/lib/rembrane
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
