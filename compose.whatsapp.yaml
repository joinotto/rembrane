services:
  rembrane-whatsapp-gateway:
    build:
      context: .
    restart: unless-stopped
    command:
      - rembrane-whatsapp-gateway
    environment:
      REMBRANE_DATABASE: /var/lib/rembrane/rembrane.db
      REMBRANE_SKIP_WORKSPACE_INIT: "1"
      REMBRANE_WHATSAPP_APP_SECRET_REFERENCE: file:/run/rembrane-secrets/rembrane_whatsapp_app_secret
      REMBRANE_WHATSAPP_BINDING_LOOKUP_SECRET_REFERENCE: file:/run/rembrane-secrets/rembrane_whatsapp_binding_lookup
      REMBRANE_WHATSAPP_WEBHOOK_VERIFICATION_TOKEN_REFERENCE: file:/run/rembrane-secrets/rembrane_whatsapp_verification_token
      REMBRANE_WHATSAPP_MAXIMUM_EVENT_AGE_SECONDS: ${REMBRANE_WHATSAPP_MAXIMUM_EVENT_AGE_SECONDS:-300}
      REMBRANE_WHATSAPP_REPLAY_WINDOW_SECONDS: ${REMBRANE_WHATSAPP_REPLAY_WINDOW_SECONDS:-604800}
      REMBRANE_WHATSAPP_MAXIMUM_REPLAY_EVENTS: ${REMBRANE_WHATSAPP_MAXIMUM_REPLAY_EVENTS:-1000000}
      REMBRANE_WHATSAPP_LISTEN: 0.0.0.0:8790
      REMBRANE_WHATSAPP_ALLOW_NON_LOOPBACK: "1"
      REMBRANE_KEY_PROVIDER: ${REMBRANE_KEY_PROVIDER:-environment}
      REMBRANE_WORKSPACE_KEY_ID: ${REMBRANE_WORKSPACE_KEY_ID:-}
      REMBRANE_WORKSPACE_KEY_REFERENCE: ${REMBRANE_WORKSPACE_KEY_REFERENCE:-file:/run/rembrane-secrets/rembrane_workspace_key}
      REMBRANE_KEYCHAIN_SERVICE: ${REMBRANE_KEYCHAIN_SERVICE:-}
      REMBRANE_KEYCHAIN_ACCOUNT: ${REMBRANE_KEYCHAIN_ACCOUNT:-}
      REMBRANE_KEYCHAIN_HISTORICAL_KEYS: ${REMBRANE_KEYCHAIN_HISTORICAL_KEYS:-}
      REMBRANE_KEY_PROVIDER_BASE_URL: ${REMBRANE_KEY_PROVIDER_BASE_URL:-}
      REMBRANE_KEY_PROVIDER_TOKEN: ${REMBRANE_KEY_PROVIDER_TOKEN:-}
      REMBRANE_KEY_PROVIDER_TOKEN_REFERENCE: ${REMBRANE_KEY_PROVIDER_TOKEN_REFERENCE:-}
      REMBRANE_KEY_PROVIDER_ALGORITHM: ${REMBRANE_KEY_PROVIDER_ALGORITHM:-xchacha20poly1305-ietf}
      REMBRANE_KEY_PROVIDER_REQUIRE_HISTORICAL_KEYS: ${REMBRANE_KEY_PROVIDER_REQUIRE_HISTORICAL_KEYS:-true}
    secrets:
      - source: rembrane_workspace_key
        target: rembrane_workspace_key
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: rembrane_whatsapp_app_secret
        target: rembrane_whatsapp_app_secret
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: rembrane_whatsapp_binding_lookup
        target: rembrane_whatsapp_binding_lookup
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: rembrane_whatsapp_verification_token
        target: rembrane_whatsapp_verification_token
        uid: "10001"
        gid: "10001"
        mode: 0400
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - rembrane-data:/var/lib/rembrane
    depends_on:
      rembrane:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /run/rembrane-secrets:size=1m,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  rembrane-channel-worker:
    build:
      context: .
    restart: unless-stopped
    command:
      - rembrane-channel-worker
    environment:
      REMBRANE_DATABASE: /var/lib/rembrane/rembrane.db
      REMBRANE_SKIP_WORKSPACE_INIT: "1"
      REMBRANE_WORKSPACE_ID: ${REMBRANE_WORKSPACE_ID:?required}
      REMBRANE_CHANNEL_PROCESSOR_URL: ${REMBRANE_CHANNEL_PROCESSOR_URL:?required}
      REMBRANE_CHANNEL_PROCESSOR_TOKEN_REFERENCE: file:/run/rembrane-secrets/rembrane_channel_processor_token
      REMBRANE_CHANNEL_WORKER_BATCH_SIZE: ${REMBRANE_CHANNEL_WORKER_BATCH_SIZE:-10}
      REMBRANE_CHANNEL_WORKER_POLL_MILLISECONDS: ${REMBRANE_CHANNEL_WORKER_POLL_MILLISECONDS:-1000}
      REMBRANE_CHANNEL_WORKER_MAXIMUM_ATTEMPTS: ${REMBRANE_CHANNEL_WORKER_MAXIMUM_ATTEMPTS:-5}
      REMBRANE_CHANNEL_WORKER_RETRY_DELAY_SECONDS: ${REMBRANE_CHANNEL_WORKER_RETRY_DELAY_SECONDS:-30}
      REMBRANE_CHANNEL_WORKER_LEASE_SECONDS: ${REMBRANE_CHANNEL_WORKER_LEASE_SECONDS:-300}
      REMBRANE_KEY_PROVIDER: ${REMBRANE_KEY_PROVIDER:-environment}
      REMBRANE_WORKSPACE_KEY_ID: ${REMBRANE_WORKSPACE_KEY_ID:-}
      REMBRANE_WORKSPACE_KEY_REFERENCE: ${REMBRANE_WORKSPACE_KEY_REFERENCE:-file:/run/rembrane-secrets/rembrane_workspace_key}
      REMBRANE_KEYCHAIN_SERVICE: ${REMBRANE_KEYCHAIN_SERVICE:-}
      REMBRANE_KEYCHAIN_ACCOUNT: ${REMBRANE_KEYCHAIN_ACCOUNT:-}
      REMBRANE_KEYCHAIN_HISTORICAL_KEYS: ${REMBRANE_KEYCHAIN_HISTORICAL_KEYS:-}
      REMBRANE_KEY_PROVIDER_BASE_URL: ${REMBRANE_KEY_PROVIDER_BASE_URL:-}
      REMBRANE_KEY_PROVIDER_TOKEN: ${REMBRANE_KEY_PROVIDER_TOKEN:-}
      REMBRANE_KEY_PROVIDER_TOKEN_REFERENCE: ${REMBRANE_KEY_PROVIDER_TOKEN_REFERENCE:-}
      REMBRANE_KEY_PROVIDER_ALGORITHM: ${REMBRANE_KEY_PROVIDER_ALGORITHM:-xchacha20poly1305-ietf}
      REMBRANE_KEY_PROVIDER_REQUIRE_HISTORICAL_KEYS: ${REMBRANE_KEY_PROVIDER_REQUIRE_HISTORICAL_KEYS:-true}
    secrets:
      - source: rembrane_workspace_key
        target: rembrane_workspace_key
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: rembrane_channel_processor_token
        target: rembrane_channel_processor_token
        uid: "10001"
        gid: "10001"
        mode: 0400
    volumes:
      - rembrane-data:/var/lib/rembrane
    depends_on:
      rembrane:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /run/rembrane-secrets:size=1m,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  rembrane_whatsapp_app_secret:
    file: ${REMBRANE_WHATSAPP_APP_SECRET_FILE:?required}
  rembrane_whatsapp_binding_lookup:
    file: ${REMBRANE_WHATSAPP_BINDING_LOOKUP_SECRET_FILE:?required}
  rembrane_whatsapp_verification_token:
    file: ${REMBRANE_WHATSAPP_WEBHOOK_VERIFICATION_TOKEN_FILE:?required}
  rembrane_channel_processor_token:
    file: ${REMBRANE_CHANNEL_PROCESSOR_TOKEN_FILE:?required}
