services:
  rembrane-whatsapp-gateway:
    build:
      context: .
    restart: unless-stopped
    command:
      - rembrane-whatsapp-gateway
    environment:
      REMBRANE_DATABASE: /var/lib/rembrane/rembrane.db
      REMBRANE_WHATSAPP_APP_SECRET: ${REMBRANE_WHATSAPP_APP_SECRET:?required}
      REMBRANE_WHATSAPP_BINDING_LOOKUP_SECRET: ${REMBRANE_WHATSAPP_BINDING_LOOKUP_SECRET:?required}
      REMBRANE_WHATSAPP_WEBHOOK_VERIFICATION_TOKEN: ${REMBRANE_WHATSAPP_WEBHOOK_VERIFICATION_TOKEN:?required}
      REMBRANE_WHATSAPP_MAXIMUM_EVENT_AGE_SECONDS: ${REMBRANE_WHATSAPP_MAXIMUM_EVENT_AGE_SECONDS:-300}
      REMBRANE_WHATSAPP_REPLAY_WINDOW_SECONDS: ${REMBRANE_WHATSAPP_REPLAY_WINDOW_SECONDS:-604800}
      REMBRANE_WHATSAPP_MAXIMUM_REPLAY_EVENTS: ${REMBRANE_WHATSAPP_MAXIMUM_REPLAY_EVENTS:-1000000}
      REMBRANE_WHATSAPP_LISTEN: 0.0.0.0:8790
      REMBRANE_WHATSAPP_ALLOW_NON_LOOPBACK: "1"
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - rembrane-data:/var/lib/rembrane
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
