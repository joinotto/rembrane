[package]
name = "rembrane-remote-mcp-http"
description = "OAuth-aware HTTP authorization gate for Rembrane remote MCP transports"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
axum = "0.8"
rembrane-application = { path = "../../crates/rembrane-application" }
rembrane-config = { path = "../../crates/rembrane-config" }
rembrane-contracts = { path = "../../crates/rembrane-contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[dev-dependencies]
rembrane-domain = { path = "../../crates/rembrane-domain" }
tokio = { version = "1", features = ["macros", "rt"] }
tower = "0.5"

[lints]
workspace = true
