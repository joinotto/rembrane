[package]
name = "rembrane-oauth-introspection-http"
description = "Bounded HTTPS transport for Rembrane OAuth token introspection"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bytes = "1"
rembrane-config = { path = "../../crates/rembrane-config" }
rembrane-oauth-introspection = { path = "../rembrane-oauth-introspection" }
rembrane-secret-local = { path = "../rembrane-secret-local" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[lints]
workspace = true
