[package]
name = "rembrane-channel-processor-http"
description = "Authenticated bounded HTTP channel-message processor for Rembrane"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bytes = "1"
rembrane-application = { path = "../../crates/rembrane-application" }
rembrane-contracts = { path = "../../crates/rembrane-contracts" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[dev-dependencies]
rembrane-domain = { path = "../../crates/rembrane-domain" }

[lints]
workspace = true
