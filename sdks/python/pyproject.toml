[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rembrane"
version = "0.1.0a1"
description = "Zero-dependency Python client for the Rembrane API"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.setuptools]
py-modules = ["rembrane"]
