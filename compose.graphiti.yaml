services:
  graph-projection-worker:
    build:
      context: .
    restart: unless-stopped
    command:
      - rembrane-graph-worker
    environment:
      REMBRANE_DATABASE: /var/lib/rembrane/rembrane.db
      REMBRANE_PRINCIPAL_ID: ${REMBRANE_PRINCIPAL_ID:?required}
      REMBRANE_WORKSPACE_ID: ${REMBRANE_WORKSPACE_ID:?required}
      REMBRANE_KEY_PROVIDER: environment
      REMBRANE_WORKSPACE_KEY_ID: ${REMBRANE_WORKSPACE_KEY_ID:?required}
      REMBRANE_WORKSPACE_KEY_REFERENCE: file:/run/rembrane-secrets/rembrane_workspace_key
      REMBRANE_GRAPH_PROVIDER: graphiti
      REMBRANE_GRAPH_PROVIDER_ALLOW_PLAINTEXT: "true"
      REMBRANE_GRAPHITI_BASE_URL: http://graphiti-sidecar:8793
      REMBRANE_GRAPHITI_BEARER_TOKEN_REFERENCE: file:/run/rembrane-secrets/rembrane_graphiti_bearer_token
      REMBRANE_GRAPH_WORKER_POLL_MILLISECONDS: ${REMBRANE_GRAPH_WORKER_POLL_MILLISECONDS:-1000}
      REMBRANE_GRAPH_WORKER_MAXIMUM_ATTEMPTS: ${REMBRANE_GRAPH_WORKER_MAXIMUM_ATTEMPTS:-5}
    secrets:
      - source: rembrane_workspace_key
        target: rembrane_workspace_key
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: rembrane_graphiti_bearer_token
        target: rembrane_graphiti_bearer_token
        uid: "10001"
        gid: "10001"
        mode: 0400
    volumes:
      - rembrane-data:/var/lib/rembrane
    depends_on:
      graphiti-sidecar:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /run/rembrane-secrets:size=1m,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  graphiti-sidecar:
    build:
      context: .
      dockerfile: sidecars/rembrane-graphiti/Dockerfile
    restart: unless-stopped
    environment:
      REMBRANE_GRAPHITI_BEARER_TOKEN_REFERENCE: file:/run/rembrane-secrets/rembrane_graphiti_bearer_token
      REMBRANE_GRAPHITI_HOST: 0.0.0.0
      REMBRANE_GRAPHITI_PORT: "8793"
      NEO4J_URI: bolt://graphiti-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_AUTH_REFERENCE: file:/run/rembrane-secrets/rembrane_graphiti_neo4j_auth
      OPENAI_API_KEY_REFERENCE: file:/run/rembrane-secrets/rembrane_graphiti_openai_api_key
    secrets:
      - source: rembrane_graphiti_bearer_token
        target: rembrane_graphiti_bearer_token
        uid: "10002"
        gid: "10002"
        mode: 0400
      - source: rembrane_graphiti_neo4j_auth
        target: rembrane_graphiti_neo4j_auth
        uid: "10002"
        gid: "10002"
        mode: 0400
      - source: rembrane_graphiti_openai_api_key
        target: rembrane_graphiti_openai_api_key
        uid: "10002"
        gid: "10002"
        mode: 0400
    ports:
      - "127.0.0.1:8793:8793"
    depends_on:
      graphiti-neo4j:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/rembrane-secrets:size=1m,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  graphiti-neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH_FILE: /run/secrets/rembrane_graphiti_neo4j_auth
    secrets:
      - source: rembrane_graphiti_neo4j_auth
        target: rembrane_graphiti_neo4j_auth
        uid: "7474"
        gid: "7474"
        mode: 0400
    volumes:
      - rembrane-graphiti-neo4j:/data
    expose:
      - "7687"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -u neo4j
          -p "$$(cut -d/ -f2- /run/secrets/rembrane_graphiti_neo4j_auth)"
          "RETURN 1" >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  rembrane-graphiti-neo4j:

secrets:
  rembrane_graphiti_bearer_token:
    file: ${REMBRANE_GRAPHITI_BEARER_TOKEN_FILE:?required}
  rembrane_graphiti_neo4j_auth:
    file: ${REMBRANE_GRAPHITI_NEO4J_AUTH_FILE:?required}
  rembrane_graphiti_openai_api_key:
    file: ${REMBRANE_GRAPHITI_OPENAI_API_KEY_FILE:?required}
