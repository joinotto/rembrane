services:
  graphiti-sidecar:
    build:
      context: ./sidecars/rembrane-graphiti
    restart: unless-stopped
    environment:
      REMBRANE_GRAPHITI_BEARER_TOKEN: ${REMBRANE_GRAPHITI_BEARER_TOKEN:?required}
      REMBRANE_GRAPHITI_HOST: 0.0.0.0
      REMBRANE_GRAPHITI_PORT: "8793"
      NEO4J_URI: bolt://graphiti-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${REMBRANE_GRAPHITI_NEO4J_PASSWORD:?required}
      OPENAI_API_KEY: ${REMBRANE_GRAPHITI_OPENAI_API_KEY:?required}
    ports:
      - "127.0.0.1:8793:8793"
    depends_on:
      graphiti-neo4j:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  graphiti-neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${REMBRANE_GRAPHITI_NEO4J_PASSWORD:?required}
      NEO4J_PASSWORD: ${REMBRANE_GRAPHITI_NEO4J_PASSWORD:?required}
    volumes:
      - rembrane-graphiti-neo4j:/data
    expose:
      - "7687"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -u neo4j
          -p "$$NEO4J_PASSWORD"
          "RETURN 1" >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  rembrane-graphiti-neo4j:
