[package]
name = "rembrane-whatsapp-gateway"
description = "Least-privileged WhatsApp Business webhook gateway for Rembrane"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
axum = "0.8"
rembrane-channel-whatsapp = { path = "../../adapters/rembrane-channel-whatsapp" }
rembrane-crypto = { path = "../../crates/rembrane-crypto" }
rembrane-crypto-configured = { path = "../../adapters/rembrane-crypto-configured" }
rembrane-store-sqlite = { path = "../../adapters/rembrane-store-sqlite" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
zeroize = "1"

[lints]
workspace = true

[dev-dependencies]
rembrane-application = { path = "../../crates/rembrane-application" }
rembrane-contracts = { path = "../../crates/rembrane-contracts" }
rembrane-domain = { path = "../../crates/rembrane-domain" }
rembrane-crypto-rustcrypto = { path = "../../adapters/rembrane-crypto-rustcrypto" }
ring = "0.17"

[[bin]]
name = "rembrane-whatsapp-gateway"
path = "src/main.rs"
