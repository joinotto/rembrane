[package]
name = "rembrane-mcp"
description = "Local stdio MCP server for Rembrane"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
rembrane-application = { path = "../../crates/rembrane-application" }
rembrane-config = { path = "../../crates/rembrane-config" }
rembrane-contracts = { path = "../../crates/rembrane-contracts" }
rembrane-crypto-configured = { path = "../../adapters/rembrane-crypto-configured" }
rembrane-domain = { path = "../../crates/rembrane-domain" }
rembrane-store-sqlite = { path = "../../adapters/rembrane-store-sqlite" }
rmcp = { version = "3.4.1", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[[bin]]
name = "rembrane-mcp"
path = "src/main.rs"

[lib]
name = "rembrane_mcp"
path = "src/lib.rs"
