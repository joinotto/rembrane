[package]
name = "rembrane-cli"
description = "Command-line interface for Rembrane"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rembrane-channel-mobile-share = { path = "../../adapters/rembrane-channel-mobile-share" }
rembrane-channel-whatsapp = { path = "../../adapters/rembrane-channel-whatsapp" }
rembrane-application = { path = "../../crates/rembrane-application" }
rembrane-crypto-configured = { path = "../../adapters/rembrane-crypto-configured" }
rembrane-contracts = { path = "../../crates/rembrane-contracts" }
rembrane-config = { path = "../../crates/rembrane-config" }
rembrane-crypto = { path = "../../crates/rembrane-crypto" }
rembrane-domain = { path = "../../crates/rembrane-domain" }
rembrane-memory-provider-configured = { path = "../../adapters/rembrane-memory-provider-configured" }
rembrane-provider-sdk = { path = "../../crates/rembrane-provider-sdk" }
rembrane-semantic-mem0 = { path = "../../adapters/rembrane-semantic-mem0" }
rembrane-semantic-native = { path = "../../adapters/rembrane-semantic-native" }
rembrane-semantic-supermemory = { path = "../../adapters/rembrane-semantic-supermemory" }
rembrane-secret-local = { path = "../../adapters/rembrane-secret-local" }
rembrane-store-memory = { path = "../../adapters/rembrane-store-memory" }
rembrane-store-sqlite = { path = "../../adapters/rembrane-store-sqlite" }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[lints]
workspace = true

[[bin]]
name = "rembrane"
path = "src/main.rs"
