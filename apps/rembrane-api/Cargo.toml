[package]
name = "rembrane-api"
description = "Authenticated HTTP API for Rembrane"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
axum = "0.8"
rembrane-application = { path = "../../crates/rembrane-application" }
rembrane-codec = { path = "../../crates/rembrane-codec" }
rembrane-config = { path = "../../crates/rembrane-config" }
rembrane-contracts = { path = "../../crates/rembrane-contracts" }
rembrane-crypto-configured = { path = "../../adapters/rembrane-crypto-configured" }
rembrane-domain = { path = "../../crates/rembrane-domain" }
rembrane-graph-configured = { path = "../../adapters/rembrane-graph-configured" }
rembrane-secret-local = { path = "../../adapters/rembrane-secret-local" }
rembrane-store-sqlite = { path = "../../adapters/rembrane-store-sqlite" }
serde = { version = "1", features = ["derive"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
zeroize = "1"

[dev-dependencies]
rembrane-crypto-rustcrypto = { path = "../../adapters/rembrane-crypto-rustcrypto" }
rembrane-graph-native = { path = "../../adapters/rembrane-graph-native" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[lints]
workspace = true

[[bin]]
name = "rembrane-api"
path = "src/main.rs"
