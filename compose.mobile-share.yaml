services:
  rembrane-mobile-share-gateway:
    build:
      context: .
    restart: unless-stopped
    command:
      - rembrane-mobile-share-gateway
    environment:
      REMBRANE_DATABASE: /var/lib/rembrane/rembrane.db
      REMBRANE_MOBILE_SHARE_SIGNING_SECRET: ${REMBRANE_MOBILE_SHARE_SIGNING_SECRET:-}
      REMBRANE_MOBILE_SHARE_SIGNING_SECRET_REFERENCE: ${REMBRANE_MOBILE_SHARE_SIGNING_SECRET_REFERENCE:-}
      REMBRANE_MOBILE_SHARE_BINDING_LOOKUP_SECRET: ${REMBRANE_MOBILE_SHARE_BINDING_LOOKUP_SECRET:-}
      REMBRANE_MOBILE_SHARE_BINDING_LOOKUP_SECRET_REFERENCE: ${REMBRANE_MOBILE_SHARE_BINDING_LOOKUP_SECRET_REFERENCE:-}
      REMBRANE_MOBILE_SHARE_MAXIMUM_EVENT_AGE_SECONDS: ${REMBRANE_MOBILE_SHARE_MAXIMUM_EVENT_AGE_SECONDS:-300}
      REMBRANE_MOBILE_SHARE_REPLAY_WINDOW_SECONDS: ${REMBRANE_MOBILE_SHARE_REPLAY_WINDOW_SECONDS:-604800}
      REMBRANE_MOBILE_SHARE_MAXIMUM_REPLAY_EVENTS: ${REMBRANE_MOBILE_SHARE_MAXIMUM_REPLAY_EVENTS:-100000}
      REMBRANE_MOBILE_SHARE_LISTEN: 0.0.0.0:8791
      REMBRANE_MOBILE_SHARE_ALLOW_NON_LOOPBACK: "1"
      REMBRANE_KEY_PROVIDER: ${REMBRANE_KEY_PROVIDER:-environment}
      REMBRANE_WORKSPACE_KEY_ID: ${REMBRANE_WORKSPACE_KEY_ID:-}
      REMBRANE_WORKSPACE_KEY_REFERENCE: ${REMBRANE_WORKSPACE_KEY_REFERENCE:-file:/run/secrets/rembrane_workspace_key}
      REMBRANE_KEYCHAIN_SERVICE: ${REMBRANE_KEYCHAIN_SERVICE:-}
      REMBRANE_KEYCHAIN_ACCOUNT: ${REMBRANE_KEYCHAIN_ACCOUNT:-}
      REMBRANE_KEYCHAIN_HISTORICAL_KEYS: ${REMBRANE_KEYCHAIN_HISTORICAL_KEYS:-}
      REMBRANE_KEY_PROVIDER_BASE_URL: ${REMBRANE_KEY_PROVIDER_BASE_URL:-}
      REMBRANE_KEY_PROVIDER_TOKEN: ${REMBRANE_KEY_PROVIDER_TOKEN:-}
      REMBRANE_KEY_PROVIDER_TOKEN_REFERENCE: ${REMBRANE_KEY_PROVIDER_TOKEN_REFERENCE:-}
      REMBRANE_KEY_PROVIDER_ALGORITHM: ${REMBRANE_KEY_PROVIDER_ALGORITHM:-xchacha20poly1305-ietf}
      REMBRANE_KEY_PROVIDER_REQUIRE_HISTORICAL_KEYS: ${REMBRANE_KEY_PROVIDER_REQUIRE_HISTORICAL_KEYS:-true}
    secrets:
      - source: rembrane_workspace_key
        target: rembrane_workspace_key
        uid: "10001"
        gid: "10001"
        mode: 0400
    ports:
      - "127.0.0.1:8791:8791"
    volumes:
      - rembrane-data:/var/lib/rembrane
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
