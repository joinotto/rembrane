[project]
name = "rembrane-graphiti-sidecar"
version = "0.1.0a1"
description = "Authenticated Graphiti projection sidecar for Rembrane"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1",
  "graphiti-core>=0.30,<0.32",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
]

[project.scripts]
rembrane-graphiti-sidecar = "rembrane_graphiti.app:run"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rembrane_graphiti"]

[tool.pytest.ini_options]
testpaths = ["tests"]
