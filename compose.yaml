services:
  rembrane:
    build:
      context: .
    restart: unless-stopped
    environment:
      REMBRANE_DATABASE: /var/lib/rembrane/rembrane.db
      REMBRANE_PRINCIPAL_ID: ${REMBRANE_PRINCIPAL_ID:?required}
      REMBRANE_WORKSPACE_ID: ${REMBRANE_WORKSPACE_ID:?required}
      REMBRANE_CLIENT_ID: ${REMBRANE_CLIENT_ID:?required}
      REMBRANE_READ_SCOPES: ${REMBRANE_READ_SCOPES:-global}
      REMBRANE_READ_PERMISSIONS: ${REMBRANE_READ_PERMISSIONS:-}
      REMBRANE_KEY_PROVIDER: environment
      REMBRANE_WORKSPACE_KEY_ID: ${REMBRANE_WORKSPACE_KEY_ID:?required}
      REMBRANE_WORKSPACE_KEY_REFERENCE: file:/run/rembrane-secrets/rembrane_workspace_key
      REMBRANE_API_TOKEN_REFERENCE: file:/run/rembrane-secrets/rembrane_api_token
      REMBRANE_LISTEN: 0.0.0.0:8787
      REMBRANE_ALLOW_NON_LOOPBACK: "1"
    secrets:
      - source: rembrane_workspace_key
        target: rembrane_workspace_key
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: rembrane_api_token
        target: rembrane_api_token
        uid: "10001"
        gid: "10001"
        mode: 0400
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - rembrane-data:/var/lib/rembrane
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /run/rembrane-secrets:size=1m,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  rembrane-data:

secrets:
  rembrane_workspace_key:
    file: ${REMBRANE_WORKSPACE_KEY_FILE:?required}
  rembrane_api_token:
    file: ${REMBRANE_API_TOKEN_FILE:?required}
